name: Deploy GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "mkdocs.yml"
      - "requirements-pages.txt"
      - "site/**"
      - "README.md"
      - "ARTICLES.md"
      - "SNAPSHOT.md"
      - "VERSION"
      - "analysis/*.md"
      - "analysis/visuals/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REPOSITORY_NAME: ${{ github.repository }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out reader-facing sources
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pages.yml
            /mkdocs.yml
            /requirements-pages.txt
            /site/
            /README.md
            /ARTICLES.md
            /SNAPSHOT.md
            /VERSION
            /analysis/*.md
            /analysis/visuals/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Configure versioned site identity
        run: |
          version="$(cat VERSION)"
          {
            echo "SITE_VERSION_BRANCH=$version"
            echo "SITE_NAME=Claude Code CLI $version 技术档案"
            echo "SITE_DESCRIPTION=Claude Code CLI $version 的运行机制、上下文治理、工具控制、协作系统与逆向证据"
            echo "SITE_COPYRIGHT=Claude Code CLI $version 发布物研究与技术分析"
          } >> "$GITHUB_ENV"

      - name: Install site dependencies
        run: python -m pip install --requirement requirements-pages.txt

      - name: Prepare Markdown sources
        run: python site/prepare_site.py

      - name: Build the multi-page site
        run: mkdocs build --strict

      - name: Rewrite evidence links
        run: python site/postprocess_site.py .site-output

      - name: Validate the generated site
        run: python site/validate_site.py .site-output

      - name: Configure Pages metadata
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
