site_name: !ENV [SITE_NAME, "Claude Code CLI 技术档案"]
site_description: !ENV [SITE_DESCRIPTION, "Claude Code CLI 的运行机制、上下文治理、工具控制、协作系统与逆向证据"]
site_url: !ENV [SITE_URL, "https://swallowdili.github.io/claudecodecli-sourcecode/"]
repo_name: !ENV [REPOSITORY_NAME, "SwallOwDili/claudecodecli-sourcecode"]
repo_url: !ENV [REPOSITORY_URL, "https://github.com/SwallOwDili/claudecodecli-sourcecode"]
copyright: !ENV [SITE_COPYRIGHT, "Claude Code CLI 发布物研究与技术分析"]

docs_dir: .site-content
site_dir: .site-output
use_directory_urls: false
strict: true

not_in_nav: |
  articles/*

theme:
  name: material
  custom_dir: site/overrides
  language: zh
  font: false
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s_\-\.、，。；：！？（）/`]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 复制本节链接
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: ignore
    not_found: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: relative_to_docs
    anchors: ignore

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: !ENV [REPOSITORY_URL, "https://github.com/SwallOwDili/claudecodecli-sourcecode"]
      name: GitHub 仓库

